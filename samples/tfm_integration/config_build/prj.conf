# nothing here

CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_SFN=y
CONFIG_REBOOT=y


# The Zephyr CMSIS emulation assumes that ticks are ms, currently
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_MAIN_STACK_SIZE=8096
CONFIG_HEAP_MEM_POOL_SIZE=8096

CONFIG_TFM_BL2=n
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=y
CONFIG_TFM_PARTITION_INTERNAL_TRUSTED_STORAGE=y
CONFIG_TFM_PARTITION_CRYPTO=y

CONFIG_TFM_LOG_LEVEL_SILENCE=n
CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=n
CONFIG_TFM_CMAKE_BUILD_TYPE_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y


CONFIG_SOC_NRF54LX_SKIP_CLOCK_CONFIG=y
CONFIG_MBEDTLS=y
#CONFIG_FLASH=y
#CONFIG_FLASH_MAP=y
